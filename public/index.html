<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPC Convective Outlook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0c0e14;
            --surface: rgba(14, 17, 26, 0.88);
            --surface-border: rgba(255, 255, 255, 0.06);
            --text: #e4e8f1;
            --text-muted: #6b7494;
            --text-dim: #49516e;
            --accent: #5b8df9;
            --accent-glow: rgba(91, 141, 249, 0.15);
            --radius: 10px;
            --radius-sm: 6px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* -- Toolbar -- */
        .toolbar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 5px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
        }

        .toolbar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px 0 8px;
            margin-right: 4px;
            border-right: 1px solid var(--surface-border);
            height: 32px;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 9px;
            color: #fff;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .brand-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--surface-border);
            margin: 0 4px;
        }

        .toolbar-group {
            display: flex;
            gap: 2px;
        }

        .tb-btn {
            padding: 7px 14px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            white-space: nowrap;
        }

        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
        }

        .tb-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 10px rgba(91, 141, 249, 0.25);
        }

        .tb-btn-layer {
            padding: 7px 12px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            white-space: nowrap;
        }

        .tb-btn-layer:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .tb-btn-layer.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        /* -- Map -- */
        #map {
            width: 100%;
            height: 100vh;
            background: var(--bg);
        }

        /* -- Floating Panels -- */
        .panel {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 16px;
            z-index: 900;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        /* Legend */
        .legend-panel {
            bottom: 28px;
            left: 16px;
            min-width: 160px;
        }

        .legend-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 3px 0;
        }

        .legend-color {
            width: 18px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-label {
            font-size: 11.5px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Info */
        .info-panel {
            top: 16px;
            right: 16px;
            min-width: 190px;
        }

        .info-panel-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .info-panel-detail {
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .info-panel-detail strong {
            color: var(--text);
            font-weight: 500;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        .status-dot.active { background: #34d399; }
        .status-dot.empty  { background: var(--text-dim); }

        /* -- Loading -- */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(12, 14, 20, 0.8);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(91, 141, 249, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* -- Popup -- */
        .leaflet-popup-content-wrapper {
            background: var(--surface) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid var(--surface-border) !important;
            border-radius: 10px !important;
            color: var(--text) !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4) !important;
        }

        .leaflet-popup-tip {
            background: var(--surface) !important;
        }

        .leaflet-popup-content {
            margin: 14px 16px !important;
            font-family: 'Inter', sans-serif !important;
        }

        .popup-header {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .popup-risk-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }

        .popup-meta {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .popup-meta strong {
            color: var(--text);
            font-weight: 500;
        }

        /* -- Leaflet overrides -- */
        .leaflet-control-zoom a {
            background: var(--surface) !important;
            backdrop-filter: blur(12px) !important;
            color: var(--text-muted) !important;
            border: 1px solid var(--surface-border) !important;
            width: 32px !important;
            height: 32px !important;
            line-height: 32px !important;
            font-size: 15px !important;
        }

        .leaflet-control-zoom a:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            color: var(--text) !important;
        }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3) !important;
            border-radius: 8px !important;
            overflow: hidden;
        }

        .leaflet-control-attribution {
            background: rgba(12, 14, 20, 0.7) !important;
            color: var(--text-dim) !important;
            font-size: 10px !important;
            font-family: 'Inter', sans-serif !important;
        }

        .leaflet-control-attribution a {
            color: var(--text-muted) !important;
        }

        /* -- Error -- */
        .error-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(127, 29, 29, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: var(--radius);
            padding: 10px 20px;
            color: #fca5a5;
            font-size: 12px;
            font-weight: 500;
            z-index: 1200;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .error-toast.visible { display: block; }

        /* -- Responsive -- */
        @media (max-width: 768px) {
            .toolbar {
                top: 10px;
                left: 10px;
                right: 10px;
                transform: none;
                flex-wrap: wrap;
                gap: 4px;
                padding: 6px;
            }

            .toolbar-brand { display: none; }

            .toolbar-group {
                flex-wrap: wrap;
                justify-content: center;
            }

            .tb-btn, .tb-btn-layer {
                padding: 6px 10px;
                font-size: 11.5px;
            }

            .legend-panel {
                bottom: 16px;
                left: 10px;
                padding: 12px;
            }

            .info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Toolbar -->
    <div class="toolbar">
        <div class="toolbar-brand">
            <div class="brand-icon">SPC</div>
            <span class="brand-text">Convective Outlook</span>
        </div>

        <div class="toolbar-group">
            <button class="tb-btn active" data-day="1">Day 1</button>
            <button class="tb-btn" data-day="2">Day 2</button>
            <button class="tb-btn" data-day="3">Day 3</button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
            <button class="tb-btn-layer active" data-layer="categorical">Categorical</button>
            <button class="tb-btn-layer" data-layer="tornado">Tornado</button>
            <button class="tb-btn-layer" data-layer="wind">Wind</button>
            <button class="tb-btn-layer" data-layer="hail">Hail</button>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading outlook data&hellip;</div>
    </div>

    <!-- Error -->
    <div class="error-toast" id="errorToast"></div>

    <!-- Legend -->
    <div class="panel legend-panel" id="legendPanel">
        <div class="legend-title">Risk Levels</div>
        <div id="legendContent"></div>
    </div>

    <!-- Info -->
    <div class="panel info-panel" id="infoPanel">
        <div class="info-panel-title" id="infoPanelTitle">Day 1 Outlook</div>
        <div class="info-panel-detail" id="infoPanelDetail">
            <strong>Layer:</strong> Categorical<br>
            <strong>Status:</strong> Loading&hellip;
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    (function () {
        'use strict';

        // --------------------------------------------------
        // Configuration
        // --------------------------------------------------

        const SPC_BASE = 'https://www.spc.noaa.gov/products/outlook';

        // GeoJSON endpoints for each day and layer type
        const DATA_URLS = {
            1: {
                categorical: `${SPC_BASE}/day1otlk_cat.lyr.geojson`,
                tornado:     `${SPC_BASE}/day1otlk_torn.lyr.geojson`,
                wind:        `${SPC_BASE}/day1otlk_wind.lyr.geojson`,
                hail:        `${SPC_BASE}/day1otlk_hail.lyr.geojson`
            },
            2: {
                categorical: `${SPC_BASE}/day2otlk_cat.lyr.geojson`,
                tornado:     `${SPC_BASE}/day2otlk_torn.lyr.geojson`,
                wind:        `${SPC_BASE}/day2otlk_wind.lyr.geojson`,
                hail:        `${SPC_BASE}/day2otlk_hail.lyr.geojson`
            },
            3: {
                categorical: `${SPC_BASE}/day3otlk_cat.lyr.geojson`,
                tornado:     `${SPC_BASE}/day3otlk_prob.lyr.geojson`,
                wind:        `${SPC_BASE}/day3otlk_prob.lyr.geojson`,
                hail:        `${SPC_BASE}/day3otlk_prob.lyr.geojson`
            }
        };

        // Categorical risk color map
        const CAT_COLORS = {
            'TSTM':  { fill: '#76c893', stroke: '#55a67a', label: 'Thunder (General)' },
            'MRGL':  { fill: '#2dc937', stroke: '#1fa82c', label: 'Marginal (1)' },
            'SLGT':  { fill: '#e2d535', stroke: '#c4b82a', label: 'Slight (2)' },
            'ENH':   { fill: '#ff9800', stroke: '#e08600', label: 'Enhanced (3)' },
            'MDT':   { fill: '#e53935', stroke: '#c62828', label: 'Moderate (4)' },
            'HIGH':  { fill: '#ff00ff', stroke: '#c800c8', label: 'High (5)' }
        };

        // Probability colors for tornado/wind/hail
        const PROB_COLORS = {
            '0.02': { fill: '#2dc937', stroke: '#1fa82c', label: '2%' },
            '0.05': { fill: '#8B6914', stroke: '#6d5210', label: '5%' },
            '0.10': { fill: '#e2d535', stroke: '#c4b82a', label: '10%' },
            '0.15': { fill: '#ff9800', stroke: '#e08600', label: '15%' },
            '0.25': { fill: '#e53935', stroke: '#c62828', label: '25%' },
            '0.30': { fill: '#e53935', stroke: '#c62828', label: '30%' },
            '0.35': { fill: '#e53935', stroke: '#c62828', label: '35%' },
            '0.40': { fill: '#e53935', stroke: '#c62828', label: '40%' },
            '0.45': { fill: '#ff00ff', stroke: '#c800c8', label: '45%' },
            '0.60': { fill: '#8833ff', stroke: '#6a22cc', label: '60%' },
            'SIGN': { fill: '#000000', stroke: '#333333', label: 'Significant' }
        };

        // Layer-specific labels
        const LAYER_NAMES = {
            categorical: 'Categorical',
            tornado: 'Tornado',
            wind: 'Wind',
            hail: 'Hail'
        };

        // --------------------------------------------------
        // State
        // --------------------------------------------------

        let currentDay = 1;
        let currentLayer = 'categorical';
        let currentGeoJSONLayer = null;
        const dataCache = {};

        // --------------------------------------------------
        // Map Initialization
        // --------------------------------------------------

        const map = L.map('map', {
            center: [38.5, -96.5],
            zoom: 5,
            minZoom: 3,
            maxZoom: 12,
            zoomControl: true
        });

        // Use CartoDB dark tiles -- free, no API key
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Remove the CSS filter since CartoDB dark is already dark
        document.querySelector('.leaflet-tile-pane').style.filter = 'none';

        // --------------------------------------------------
        // Data Fetching
        // --------------------------------------------------

        function getCacheKey(day, layer) {
            return `${day}_${layer}`;
        }

        async function fetchOutlookData(day, layer) {
            const key = getCacheKey(day, layer);
            if (dataCache[key]) return dataCache[key];

            const url = DATA_URLS[day]?.[layer];
            if (!url) return null;

            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch data (HTTP ${response.status})`);
            }

            const geojson = await response.json();
            dataCache[key] = geojson;
            return geojson;
        }

        // --------------------------------------------------
        // Styling
        // --------------------------------------------------

        function getFeatureStyle(feature, layer) {
            const props = feature.properties || {};

            if (layer === 'categorical') {
                const label = (props.LABEL || props.LABEL2 || '').toUpperCase().trim();
                const colorInfo = CAT_COLORS[label] || { fill: '#666', stroke: '#444' };
                return {
                    fillColor: colorInfo.fill,
                    color: colorInfo.stroke,
                    weight: 1.5,
                    opacity: 0.8,
                    fillOpacity: 0.3
                };
            } else {
                // Probability-based layers
                const val = props.LABEL || props.LABEL2 || '';
                const colorInfo = PROB_COLORS[val] || PROB_COLORS[String(val)] || { fill: '#666', stroke: '#444' };
                return {
                    fillColor: colorInfo.fill,
                    color: colorInfo.stroke,
                    weight: 1.5,
                    opacity: 0.8,
                    fillOpacity: 0.3
                };
            }
        }

        function getPopupContent(feature, layer) {
            const props = feature.properties || {};
            const label = (props.LABEL || props.LABEL2 || 'N/A').toUpperCase().trim();
            const expire = props.EXPIRE || '';
            const valid = props.VALID || '';

            let riskName, badgeColor;

            if (layer === 'categorical') {
                const info = CAT_COLORS[label];
                riskName = info ? info.label : label;
                badgeColor = info ? info.fill : '#666';
            } else {
                const info = PROB_COLORS[props.LABEL || props.LABEL2 || ''];
                riskName = info ? info.label : label;
                badgeColor = info ? info.fill : '#666';
            }

            let timeHtml = '';
            if (valid || expire) {
                timeHtml = `<div class="popup-meta">`;
                if (valid) timeHtml += `<strong>Valid:</strong> ${formatSPCTime(valid)}<br>`;
                if (expire) timeHtml += `<strong>Expires:</strong> ${formatSPCTime(expire)}`;
                timeHtml += `</div>`;
            }

            return `
                <div class="popup-header">${LAYER_NAMES[layer] || 'Outlook'}</div>
                <div class="popup-risk-badge" style="background:${badgeColor};">${riskName}</div>
                ${timeHtml}
            `;
        }

        function formatSPCTime(raw) {
            if (!raw || raw.length < 8) return raw;
            // SPC times: YYYYMMDDhhmm format
            const year = raw.substring(0, 4);
            const month = raw.substring(4, 6);
            const day = raw.substring(6, 8);
            const hour = raw.substring(8, 10);
            const min = raw.substring(10, 12);
            return `${month}/${day}/${year} ${hour}:${min} UTC`;
        }

        // --------------------------------------------------
        // Render
        // --------------------------------------------------

        async function renderOutlook() {
            showLoading(true);
            hideError();

            try {
                const geojson = await fetchOutlookData(currentDay, currentLayer);

                // Remove previous layer
                if (currentGeoJSONLayer) {
                    map.removeLayer(currentGeoJSONLayer);
                    currentGeoJSONLayer = null;
                }

                if (!geojson || !geojson.features || geojson.features.length === 0) {
                    updateInfoPanel(0);
                    updateLegend([]);
                    showLoading(false);
                    return;
                }

                // Sort features so higher risks render on top
                const riskOrder = ['TSTM', 'MRGL', 'SLGT', 'ENH', 'MDT', 'HIGH'];
                const probOrder = ['0.02', '0.05', '0.10', '0.15', '0.25', '0.30', '0.35', '0.40', '0.45', '0.60', 'SIGN'];

                const sorted = [...geojson.features].sort((a, b) => {
                    const aLabel = (a.properties.LABEL || a.properties.LABEL2 || '').toString().toUpperCase().trim();
                    const bLabel = (b.properties.LABEL || b.properties.LABEL2 || '').toString().toUpperCase().trim();

                    if (currentLayer === 'categorical') {
                        return riskOrder.indexOf(aLabel) - riskOrder.indexOf(bLabel);
                    } else {
                        return probOrder.indexOf(aLabel.toLowerCase()) - probOrder.indexOf(bLabel.toLowerCase());
                    }
                });

                const sortedGeoJSON = { ...geojson, features: sorted };

                currentGeoJSONLayer = L.geoJSON(sortedGeoJSON, {
                    style: function (feature) {
                        return getFeatureStyle(feature, currentLayer);
                    },
                    onEachFeature: function (feature, lyr) {
                        const popup = getPopupContent(feature, currentLayer);
                        lyr.bindPopup(popup);

                        lyr.on('mouseover', function () {
                            this.setStyle({ fillOpacity: 0.5, weight: 2.5 });
                        });
                        lyr.on('mouseout', function () {
                            this.setStyle({ fillOpacity: 0.3, weight: 1.5 });
                        });
                    }
                }).addTo(map);

                // Collect unique labels for legend
                const usedLabels = [...new Set(
                    geojson.features.map(f =>
                        (f.properties.LABEL || f.properties.LABEL2 || '').toString().trim()
                    ).filter(Boolean)
                )];

                updateLegend(usedLabels);
                updateInfoPanel(geojson.features.length);

            } catch (err) {
                console.error('Error loading outlook:', err);
                showError('Unable to load outlook data. SPC servers may be temporarily unavailable.');
                updateInfoPanel(0);
            }

            showLoading(false);
        }

        // --------------------------------------------------
        // Legend
        // --------------------------------------------------

        function updateLegend(labels) {
            const container = document.getElementById('legendContent');
            const colorMap = currentLayer === 'categorical' ? CAT_COLORS : PROB_COLORS;

            // Order for display
            const order = currentLayer === 'categorical'
                ? ['TSTM', 'MRGL', 'SLGT', 'ENH', 'MDT', 'HIGH']
                : ['0.02', '0.05', '0.10', '0.15', '0.25', '0.30', '0.35', '0.40', '0.45', '0.60', 'SIGN'];

            const normalizedLabels = labels.map(l => l.toUpperCase ? l.toUpperCase().trim() : l.toString().trim());

            const ordered = order.filter(key => {
                return normalizedLabels.includes(key) || normalizedLabels.includes(key.toLowerCase());
            });

            if (ordered.length === 0) {
                container.innerHTML = '<div class="legend-label" style="color:#5a6a8a;">No active risks</div>';
                return;
            }

            container.innerHTML = ordered.map(key => {
                const info = colorMap[key] || colorMap[key.toLowerCase()] || { fill: '#666', label: key };
                return `
                    <div class="legend-item">
                        <div class="legend-color" style="background:${info.fill};"></div>
                        <div class="legend-label">${info.label}</div>
                    </div>
                `;
            }).join('');
        }

        // --------------------------------------------------
        // Info Panel
        // --------------------------------------------------

        function updateInfoPanel(featureCount) {
            document.getElementById('infoPanelTitle').textContent = `Day ${currentDay} Outlook`;

            const layerName = LAYER_NAMES[currentLayer] || currentLayer;
            const dotClass = featureCount > 0 ? 'active' : 'empty';
            const statusText = featureCount > 0
                ? `${featureCount} region${featureCount !== 1 ? 's' : ''}`
                : 'None';

            let note = '';
            if (currentDay === 3 && currentLayer !== 'categorical') {
                note = '<br><em style="font-size:10.5px;color:var(--text-dim);">Combined probabilistic data</em>';
            }

            document.getElementById('infoPanelDetail').innerHTML =
                `<strong>Layer:</strong> ${layerName}<br><strong>Status:</strong> <span class="status-dot ${dotClass}"></span>${statusText}${note}`;
        }

        // --------------------------------------------------
        // UI Helpers
        // --------------------------------------------------

        function showLoading(show) {
            const el = document.getElementById('loadingOverlay');
            if (show) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorToast');
            el.textContent = msg;
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), 6000);
        }

        function hideError() {
            document.getElementById('errorToast').classList.remove('visible');
        }

        // --------------------------------------------------
        // Event Handlers
        // --------------------------------------------------

        // Day buttons
        document.querySelectorAll('.tb-btn[data-day]').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tb-btn[data-day]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDay = parseInt(this.dataset.day, 10);
                renderOutlook();
            });
        });

        // Layer buttons
        document.querySelectorAll('.tb-btn-layer[data-layer]').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tb-btn-layer[data-layer]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentLayer = this.dataset.layer;
                renderOutlook();
            });
        });

        // --------------------------------------------------
        // Initial Load
        // --------------------------------------------------

        renderOutlook();

    })();
    </script>
</body>
</html>
